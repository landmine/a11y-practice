name: Test image-aware alt checking

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/accessibility-scanner@v3
        with:
          urls: |
            https://landmine.github.io/a11y-practice/
          repository: landmine/a11y-practice
          token: ${{ secrets.GH_TOKEN }}
          cache_key: test-image-aware-alt
          skip_copilot_assignment: true
          dry_run: true
          scans: |
            ["axe", {"name": "alt-text-scan", "package": "@github/accessibility-scanner-alt-text-plugin", "version": "1.1.0"}]